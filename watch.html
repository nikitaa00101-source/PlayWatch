<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0e17" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PlayWatch" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" href="icon-192.png" />
  <title>PlayWatch — סרטים וסדרות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-world="watch">
  <div id="navbar-mount"></div>

  <header class="hero container">
    <h1>עולם הצפייה. <span class="accent">סרטים וסדרות.</span></h1>
    <p>מה יוצא, מה בטרנד, ואיפה אפשר לראות את זה — בסטרימינג, להשכרה או לקנייה.</p>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="חפשו סרט או סדרה לפי שם..." />
      <button class="btn btn-primary">🔍 חיפוש</button>
    </div>
    <div class="stats-row">
      <div class="stat"><div class="num" id="stat-total">0</div><div class="lbl" id="stat-l1"></div></div>
      <div class="stat"><div class="num" id="stat-upcoming">0</div><div class="lbl">יציאות קרובות</div></div>
      <div class="stat"><div class="num" id="stat-extra">0</div><div class="lbl" id="stat-l3"></div></div>
    </div>
  </header>

  <main class="container">
    <div class="filters-bar">
      <div id="genre-chips" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
      <select class="select-field" id="kind-select">
        <option value="all">סרטים וסדרות</option>
        <option value="movie">🎬 סרטים</option>
        <option value="series">📺 סדרות</option>
      </select>
      <select class="select-field" id="status-select">
        <option value="all">כל הסטטוסים</option>
        <option value="released">יצאו לאור</option>
        <option value="upcoming">בקרוב</option>
      </select>
      <select class="select-field" id="sort-select">
        <option value="rating-desc">מיון: דירוג (גבוה לנמוך)</option>
        <option value="site-desc">מיון: דירוג PlayWatch</option>
        <option value="release-desc">מיון: תאריך יציאה</option>
        <option value="az">מיון: א-ב</option>
      </select>
      <span class="results-count" id="results-count"></span>
    </div>

    <div class="games-grid" id="games-grid"></div>
  </main>

  <footer class="site-footer">
    PlayWatch · פרויקט הדגמה · נתוני משחקים מ-<a href="https://rawg.io" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;">RAWG</a> · <a href="https://www.themoviedb.org" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;">TMDB</a> · JustWatch · מחירים מ-CheapShark
  </footer>
  <script src="data.js"></script>
  <script src="i18n.js"></script>
  <script src="config.local.js" onerror="void 0"></script>
  <script src="app.js"></script>
  <script src="franchises.js"></script>
  <script src="catalog.js"></script>
</body>
</html>
